server:
  port: 18080

spring:
  application:
    name: movielens-data-agent
  thymeleaf:
    cache: false

movielens:
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: ${LLM_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
    model: ${LLM_MODEL:${DEEPSEEK_MODEL:deepseek-v4-flash}}
    connect-timeout: 20s
    request-timeout: 90s
    max-tokens: 4096
    temperature: 0.1
    max-steps: 8
    disable-thinking: true
  pipeline:
    script: ./scripts/run-agent-pipeline.sh
    working-directory: .
    input-version: raw-v1
    rules-version: quality-rules-v1
    timeout: 20m
